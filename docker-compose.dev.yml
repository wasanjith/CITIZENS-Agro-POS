# Local development services for CITIZENS Agro POS.
# PHP runs on the host (Laravel Herd) and MySQL 8 runs as a local Windows service;
# these containers provide the remaining backing services.
#   docker compose -f docker-compose.dev.yml up -d
services:
  redis:
    image: redis:7-alpine
    container_name: citizens-redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: citizens-meilisearch
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  meili-data:
